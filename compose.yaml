services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev

    command: >
      sh -c "npm install --no-audit --no-fund && node ace migration:run --force && npm run dev"

    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      APP_NAME: loyal-api
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: http://localhost:3333
      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: ${FRONTEND_URL}
      NFC_SERVICE_URL: http://nfc

    ports:
      - '3333:3333'

    volumes:
      - ./api:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      db:
        condition: service_healthy
      nfc:
        condition: service_started

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  nfc:
    image: icedevml/sdm-backend:latest

    environment:
      MASTER_KEY: ${NFC_MASTER_KEY:?NFC_MASTER_KEY is required}

    ports:
      - '5000:80'

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_ORIGIN: http://localhost:3333
      API_ORIGIN: http://backend:3333
    ports:
      - '3000:3000'
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  postgres_data:
