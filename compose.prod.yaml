services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:3333
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/sign-in').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_NAME: loyal-api
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://${DOMAIN:?DOMAIN is required}
      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FRONTEND_URL: https://${DOMAIN:?DOMAIN is required}
      NFC_SERVICE_URL: http://nfc
    ports:
      - '127.0.0.1:3333:3333'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/up').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      nfc:
        condition: service_healthy

  nfc:
    image: icedevml/sdm-backend@sha256:1d7d881e17a81d60ba98962cc8b33d45a6c23edbfd5f59c2a9f73893b7dec91e
    restart: unless-stopped
    environment:
      MASTER_KEY: ${NFC_MASTER_KEY:?NFC_MASTER_KEY is required}
      DERIVE_MODE: legacy
      UWSGI_DISABLE_LOGGING: '1'
    volumes:
      - ./docker/nfc/nginx.conf:/app/nginx.conf:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; key = bytes.fromhex(os.environ['MASTER_KEY']); assert len(key) == 16 and any(key), 'Expected a nonzero 16-byte NFC key'; urllib.request.urlopen('http://127.0.0.1/', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:6.1.1
    profiles: ['tools']
    restart: 'no'
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
