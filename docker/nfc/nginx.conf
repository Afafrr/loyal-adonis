# Internal verifier proxy. Requests contain cryptographic NFC data in the URL.
# Keep request/access/error details out of logs; use health checks for availability.
user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/null;
daemon off;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server {
        listen 80;
        location / {
            include /etc/nginx/uwsgi_params;
            uwsgi_pass unix:///tmp/uwsgi.sock;
        }
    }
}
